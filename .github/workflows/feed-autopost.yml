name: Feed autopost

on:
  # DAGELIJKS 1 post uit FEED.json (content-eerste lijn, 24-11-2026). De oude pauze
  # (posten per rij van 3 vanwege het vaste kleurenraster) is vervallen: het raster is
  # losgelaten, dus 1 losse post per dag mag weer. 17:00 UTC = 18:00 Amsterdam (winter).
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = alleen container maken, niet publiceren"
        required: false
        default: "0"
      force_n:
        description: "post-nummer forceren (test), leeg = datum van vandaag"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: feed-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publiceer de post van vandaag
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE_N: ${{ github.event.inputs.force_n }}
        run: python publish_daily.py
      - name: Commit geplaatste staat
        run: |
          if ! git diff --quiet geplaatst.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add geplaatst.json
            git commit -m "feed: post geplaatst $(date -u +%F)"
            git push
          fi
