name: Feed autopost

on:
  # De poster draait ELK UUR in een venster; publish_daily.py beslist zelf of hij dat uur
  # post, zodat de posttijd per dag VERSCHILT (niet elke dag hetzelfde moment). Het dagdoel
  # (2/dag tijdens de opschroef t/m 8-12, daarna 1/dag) zit in publish_daily.py, niet hier.
  # 9-20 UTC = 10:00-21:00 Amsterdam (winter).
  schedule:
    - cron: "0 9-20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = alleen container maken, niet publiceren"
        required: false
        default: "0"
      force_n:
        description: "post-nummer forceren (test), leeg = datum van vandaag"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: feed-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publiceer de post van vandaag
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE_N: ${{ github.event.inputs.force_n }}
        run: python publish_daily.py
      - name: Commit geplaatste staat
        run: |
          if ! git diff --quiet geplaatst.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add geplaatst.json
            git commit -m "feed: post geplaatst $(date -u +%F)"
            git push
          fi
